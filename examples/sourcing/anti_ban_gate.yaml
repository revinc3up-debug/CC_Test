# 《大厂茶水间》信源防封门控 · 阈值配置
# 由 framework/sourcing_gate.SourcingGate.from_yaml() 加载
# 策略依据见 docs/anti-ban-gate.md（各平台封控机制实测调研）
#
# 三道闸门：min_interval（最小间隔+抖动）/ daily_quota（每日配额）/ block_cooldown（熔断冷却）
# 数值一律偏保守：宁可少拉几条、板块可删，也不要把小号撞进小黑屋。

sources:
  # 搜狗微信搜索：封 IP+Cookie(SNUID/SUV)；~5s/页翻20页即触发；未登录只看前10页
  sogou-weixin:
    min_interval_seconds: 12
    jitter_seconds: 8          # 实际 12~20s/次，避免规律性
    daily_quota: 40            # 每天几个关键词 × 少量翻页足矣
    block_cooldown_seconds: 3600   # 撞验证码/302 → 冷却 1h（同日再撞则翻倍）
    max_accounts: 1

  # 小红书：2025 风控升级，Cookie 有效期 10min、IP 高频阈值下调；官方建议 3~8s/次
  xiaohongshu:
    min_interval_seconds: 8
    jitter_seconds: 6          # 实际 8~14s/次
    daily_quota: 60
    block_cooldown_seconds: 3600
    max_accounts: 2            # 备一个小号轮换；单账号不可多端在线

  # 微博：相对宽松，但同样不高频
  weibo:
    min_interval_seconds: 5
    jitter_seconds: 4
    daily_quota: 100
    block_cooldown_seconds: 1800
    max_accounts: 1

  # 微信读书系（we-mp-rss / wewe-rss）：约"10个号 × 每天刷2次"上限，超限关 24h 小黑屋
  # 这里 quota 指"刷新次数/日"，间隔按 6h 起（21600s）
  wechat-read:
    min_interval_seconds: 21600    # 每 6 小时才允许一次全量刷新
    jitter_seconds: 1800
    daily_quota: 2                 # 每天最多刷 2 轮
    block_cooldown_seconds: 86400  # 进小黑屋 → 冷却 24h
    max_accounts: 1                # 订阅号数量超过 ~10 时，加账号而非加频率

  # 自建 DailyHotApi / RSSHub：命中自带缓存即可，不必高频；60min 一轮足够
  hot-aggregator:
    min_interval_seconds: 3600
    jitter_seconds: 300
    daily_quota: 24
    block_cooldown_seconds: 600
    max_accounts: 1

# 全局约定（供人读，门控代码不强制）：
# - 每晚 1~2 轮拉取；命中缓存不发请求。
# - 所有登录态用小号，主号不碰任何工具。
# - 任一信源冷却/配额耗尽 → 直接降级该板块（宁缺毋滥），不要绕过门控硬拉。
